<!DOCTYPE html>
<html lang="es">
<head>

  <title>Bienvenida Caroline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #0b3d91 0%, #1565c0 50%, #f57c00 100%);

    h1 { font-size: clamp(2rem, 7vw, 4.5rem); font-weight: 800; line-height: 1.15; }

<body>
  <main>
    <h1>¡Bienvenida a clase, Caroline!</h1>

</html>
