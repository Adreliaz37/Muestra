    .nav button { width: 100%; display: flex; align-items: center; gap: 11px; background: transparent; border: 0; color: #cfdcd8; padding: 9px 10px; border-radius: 10px; text-align: left; font-weight: 500; }

    .kpi em { font-style: normal; font-size: 0.74rem; color: var(--green); font-weight: 600; }

    .row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
    .row:first-of-type { border-top: 0; }
    .row .body { flex: 1; min-width: 0; }
    .row h3 { font-size: 0.98rem; font-weight: 600; }
    .row p { color: var(--muted); font-size: 0.84rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }

    .av { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--ink); color: var(--gold-l); display: grid; place-items: center; font-weight: 600; font-size: 0.86rem; }

    .tile { background: var(--paper); border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid var(--line); cursor: pointer; }
    .tile b { font-size: 0.86rem; display: block; } .tile small { color: var(--muted); }

    .sched { width: 100%; border-collapse: separate; border-spacing: 4px; min-width: 760px; }
    .sched th { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; padding: 6px; text-align: left; }
    .sched th.hoy { color: var(--ink); } .sched th.hoy::after { content: " · hoy"; color: var(--gold); }
    .sched td { vertical-align: top; }
    .sched td.who { font-weight: 600; white-space: nowrap; padding: 8px 10px 8px 0; font-size: 0.88rem; } .sched td.who small { display: block; color: var(--muted); font-weight: 400; }
    .shift { width: 100%; border: 0; text-align: left; border-radius: 10px; padding: 8px 9px; font-size: 0.76rem; color: #fff; line-height: 1.3; }
    .shift b { display: block; font-size: 0.8rem; } .shift small { opacity: 0.85; }
    .off { border-radius: 10px; padding: 8px; font-size: 0.74rem; color: #a59c88; background: repeating-linear-gradient(135deg, #f1ebdc, #f1ebdc 6px, #f7f3ea 6px, #f7f3ea 12px); text-align: center; }
    .scroll { overflow-x: auto; }

    .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left 0.2s; }
    .toggle.on { background: var(--green); } .toggle.on::after { left: 23px; }

    .level { background: var(--ink); color: #fff; border-color: var(--ink); position: relative; overflow: hidden; }
    .level::before { content: ""; position: absolute; width: 380px; height: 380px; border-radius: 50%; right: -120px; top: -160px; background: radial-gradient(circle, rgba(201, 162, 75, 0.4), transparent 70%); }
    .level > * { position: relative; }
    .level .pts { font-family: var(--serif); font-size: 3rem; color: var(--gold-l); line-height: 1; }
    .level .bar { background: rgba(255, 255, 255, 0.14); margin: 14px 0 6px; } .level .bar i { background: var(--gold); }
    .badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

    .bdg.on { opacity: 1; border: 1px solid var(--gold); background: #fbf4e1; }
    .bdg span { font-size: 1.6rem; display: block; } .bdg b { font-size: 0.8rem; display: block; } .bdg small { font-size: 0.7rem; color: var(--muted); }

    .veil { position: fixed; inset: 0; background: rgba(11, 31, 28, 0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 18px; z-index: 50; }
    .veil.on { display: flex; }
    .modal { background: var(--paper); border-radius: 22px; padding: 28px; width: min(680px, 100%); max-height: 90vh; overflow-y: auto; position: relative; animation: pop 0.25s ease-out; }

    .modal h2 { font-size: 1.45rem; padding-right: 36px; }
    .modal h4 { font-size: 0.74rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }

    .line .v { margin-left: auto; font-weight: 600; white-space: nowrap; }
    .line .bar { flex: 1; max-width: 180px; }
    .dot { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 0.7rem; color: #fff; font-weight: 700; background: #cfc6b0; }
    .dot.ok { background: var(--green); } .dot.no { background: var(--red); } .dot.wait { background: var(--gold); animation: blink 0.7s infinite; }
    .note { background: #fbf4e1; border: 1px solid var(--gold-l); border-radius: 12px; padding: 12px 14px; font-size: 0.88rem; margin-top: 10px; }
    .note.r { background: #f8dfd8; border-color: #e3a797; }
    .mail { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: 0.9rem; white-space: pre-line; }
    .foot { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .toast { position: fixed; right: 22px; bottom: 22px; background: var(--ink); color: #fff; padding: 13px 20px; border-radius: 14px; box-shadow: 0 18px 40px rgba(11, 31, 28, 0.3); transform: translateY(90px); opacity: 0; transition: all 0.35s; z-index: 60; font-weight: 500; }
    .toast.on { transform: none; opacity: 1; } .toast b { color: var(--gold-l); }
    .scan li { list-style: none; display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    @keyframes pop { from { transform: scale(0.96); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0.35; } }

    @media (max-width: 760px) {

      .logo { padding-bottom: 12px; }

      .k6, .c4, .badges { grid-template-columns: 1fr 1fr; } .kan { grid-template-columns: 1fr; }
      .row { flex-wrap: wrap; } .acts { width: 100%; justify-content: flex-start; }
    }
  </style>
</head>

    ['Tipo de limpieza', 45, PERFIL.nivel[c.tipo]],
    ['Tamaño vs. capacidad', 20, c.pies <= PERFIL.capacidad ? 1 : Math.max(0, 1 - (c.pies - PERFIL.capacidad) / PERFIL.capacidad)],
    ['Requisitos cumplidos', 20, c.req.length ? c.req.filter(ok).length / c.req.length : 1],
    ['Distancia', 10, c.millas <= 10 ? 1 : c.millas <= PERFIL.radio ? 0.6 : 0.2],
    ['Tiempo para preparar', 5, c.dias >= 10 ? 1 : c.dias >= 5 ? 0.6 : 0.3]
  ];
  return { partes, total: Math.round(partes.reduce((a, p) => a + p[1] * p[2], 0)) };
}

function nivel() {
  let i = 0; NIVELES.forEach((n, k) => { if (S.puntos >= n[1]) i = k; });
  const sig = NIVELES[i + 1];
  return [NIVELES[i][0], NIVELES[i][1], sig, sig ? Math.round((S.puntos - NIVELES[i][1]) / (sig[1] - NIVELES[i][1]) * 100) : 100];
}

function verContrato(id) {
  const c = CONTRATOS.find(x => x.id === id), sc = score(c), e = etapa(c), falla = c.falla || [];
  const faltan = c.req.filter(r => !cubierto(r)), conSocio = score(c, true).total;
  const keys = Object.keys(CHECKS);
  const chk = keys.map((k, i) => {
    let cls = '', sym = '·';
    if (e !== 'nuevo' || (V && V.id === id && i < V.paso)) { const ok = !falla.includes(k); cls = ok ? 'ok' : 'no'; sym = ok ? '✓' : '✕'; }
    else if (V && V.id === id && i === V.paso) { cls = 'wait'; sym = '…'; }
    return `<div class="line"><span class="dot ${cls}">${sym}</span>${CHECKS[k]}</div>`;
  }).join('');
  let acc = '';
  if (e === 'nuevo') acc = `<button class="btn gold" data-a="verificar" data-id="${id}" ${V ? 'disabled' : ''}>${V ? 'Verificando…' : 'Verificar contrato'}</button>`;
  if (e === 'verificado') acc = `<button class="btn gold" data-a="propuesta" data-id="${id}">Enviar propuesta</button>`;
  if (e === 'propuesta') acc = `<button class="btn gold" data-a="ganar" data-id="${id}">Simular: contrato ganado</button>`;
  modal(`<div class="meta" style="margin:0 0 10px">${estadoChip(e)}<span class="chip">${TIPOS[c.tipo]}</span><span class="chip">${c.f}</span></div>
    <h2>${c.t}</h2><p style="color:var(--muted)">${c.e} · ${num(c.pies)} pies² · a ${c.millas} millas · cierra en ${c.dias} días</p>
    <div class="row" style="border:0;padding-bottom:0">${ring(sc.total)}<div class="body"><h3>Match de ${sc.total} sobre 100</h3><p>Valor estimado: ${usd(c.valor)} al año</p></div></div>
    <h4>Por qué ese match</h4>${sc.partes.map(p => `<div class="line">${p[0]}<div class="bar ${p[2] < 0.5 ? 'low' : p[2] < 0.8 ? 'mid' : ''}" style="margin-left:auto"><i style="width:${p[2] * 100}%"></i></div><span class="v" style="margin-left:10px;width:54px;text-align:right">${Math.round(p[1] * p[2])} / ${p[1]}</span></div>`).join('')}
    <h4>Requisitos del contrato</h4>${c.req.length ? c.req.map(r => `<div class="line"><span class="dot ${cubierto(r) ? 'ok' : 'no'}">${cubierto(r) ? '✓' : '✕'}</span>${REQ[r]}</div>`).join('') : '<p style="color:var(--muted)">El anuncio no pide ningún requisito.</p>'}
    ${faltan.length && conSocio > sc.total ? `<div class="note">🤝 <b>${socioPara(faltan.find(socioPara)).n}</b> cubre lo que falta. En licitación conjunta el match sube a <b>${conSocio}</b>. <a href="#" data-a="ir" data-id="alianzas">Ver alianzas</a></div>` : ''}
    <h4>Verificación</h4>${chk}
    ${e === 'descartado' ? '<div class="note r">⚠️ <b>Alerta de fraude.</b> El anuncio no está en una fuente oficial, la empresa no aparece en registros y pide una cuota de "registro" de $750. Se descartó automáticamente.</div>' : ''}
    <div class="foot">${acc}<button class="btn line" data-a="cerrar">Cerrar</button></div>`);
}

function escanear() {
  let i = 0;
  const pinta = () => modal(`<h2>Escaneo 360 en curso</h2><p style="color:var(--muted)">Buscando contratos, clientes, socios y candidatos en el área de Chicago.</p><ul class="scan" style="margin-top:14px">${FUENTES.map((f, k) => `<li><span class="dot ${k < i ? 'ok' : k === i ? 'wait' : ''}">${k < i ? '✓' : '…'}</span>${f}</li>`).join('')}</ul>`);
  pinta();
  const t = setInterval(() => {
    i++;

      <div class="foot"><button class="btn gold" data-a="ir" data-id="contratos">Ver contratos</button><button class="btn line" data-a="cerrar">Cerrar</button></div>`);

}

/* ============ ACCIONES ============ */
const ACC = {
  ir(id) { cerrar(); S.vista = id; save(); render(); scrollTo(0, 0); },
  cerrar, scan: escanear, ver: verContrato, turno: verTurno,
  reset() { S = base(); save(); render(); toast('Demo reiniciada'); },
  verificar(id) {
    V = { id, paso: 0 }; verContrato(id);
    const t = setInterval(() => {
      if (!V) return clearInterval(t);
      V.paso++;
      if (V.paso < 5) return verContrato(id);
      clearInterval(t); V = null;
      const c = CONTRATOS.find(x => x.id === id), malo = !!c.falla;
      S.et[id] = malo ? 'descartado' : 'verificado'; S.n.verif++; if (malo) S.n.fraude++;
      pts(malo ? 50 : 20, malo ? 'Contrato falso detectado' : 'Contrato verificado');
      render(true); verContrato(id);
    }, 420);
  },
  propuesta(id) { S.et[id] = 'propuesta'; S.n.prop++; msg('Correo', CONTRATOS.find(c => c.id === id).e, 'Propuesta técnica y económica enviada'); pts(50, 'Propuesta enviada'); render(true); verContrato(id); },
  ganar(id) { S.et[id] = 'ganado'; S.n.gan++; msg('Calendario', 'Operaciones', 'Reunión de arranque del nuevo contrato agendada'); pts(200, 'Contrato ganado'); render(true); verContrato(id); },
  cli(id) {
    const c = CLIENTES.find(x => x.id === id), e = S.cli[id] ?? c.pre;
    if (e === 0) return correoCliente(c);
    S.cli[id] = e + 1;
    if (e === 1) msg('Calendario', c.quien.split(',')[0], 'Visita al inmueble agendada · ' + c.n);
    if (e === 2) msg('Correo', c.quien.split(',')[0], 'Propuesta de precio fijo · ' + c.n);
    pts(e === 3 ? 150 : 15, e === 3 ? 'Cliente nuevo: ' + c.n : 'Prospecto avanzó: ' + c.n); render();
  },
  cliEnviar(id) { const c = CLIENTES.find(x => x.id === id); S.cli[id] = 1; msg('Correo', c.quien.split(',')[0], 'Presentación de Ingrid Cleaning Solutions · ' + c.n); cerrar(); pts(15, 'Correo enviado a ' + c.n); render(); },
  socio(id) { const s = SOCIOS.find(x => x.id === id); S.soc[id] = 1; S.n.soc++; msg('Correo', s.n, 'Solicitud de informes para ' + s.modo.toLowerCase()); pts(25, 'Informes pedidos a ' + s.n); render(); },
  cand(id) {
    const c = CANDIDATOS.find(x => x.id === id), e = S.cand[id] ?? c.pre;
    S.cand[id] = e + 1; S.n.cand++;
    msg(e === 2 ? 'Correo' : 'SMS', c.n, ['Entrevista agendada para ' + c.p, 'Oferta de trabajo enviada', 'Bienvenida: documentos, uniforme y primer turno'][e]);
    pts(e === 2 ? 60 : 10, ['Entrevista agendada', 'Oferta enviada', 'Contratación'][e] + ': ' + c.n); render();
  },
  prov(id) { const p = PROVEEDORES.find(x => x.id === id); S.prov[id] = 'Activo'; msg('Correo', p.n, 'Su registro como proveedor fue aprobado'); pts(15, 'Proveedor aprobado: ' + p.n); render(); },
  pedir(id) { const i = INSUMOS.find(x => x.id === id); S.ped[id] = 1; msg('Correo', i.prov, `Orden de compra: ${i.max - i.stock} ${i.u} de ${i.n.toLowerCase()}`); pts(5, 'Pedido enviado a ' + i.prov); render(); },
  horario() { S.horario = true; msg('Calendario', EMPLEADOS.length + ' empleados', 'Turnos de la semana agregados al calendario'); msg('Correo', EMPLEADOS.length + ' empleados', 'Tu horario de la semana con direcciones'); pts(20, 'Horario semanal enviado'); render(); },
  recordar(key) { const e = EMPLEADOS.find(x => x.id === key.split('-')[0]); S.rec[key] = 1; msg('SMS', e.n, 'Recordatorio de turno con dirección y hora'); pts(5, 'Recordatorio enviado a ' + e.n); render(true); verTurno(key); },
  auto(id) { const a = AUTOS.find(x => x.id === id); S.autos[id] = !(S.autos[id] ?? !a.off); save(); render(); },
  canje(i) { const p = PREMIOS[i]; if (S.saldo < p[1]) return; S.saldo -= p[1]; S.canjes.push(+i); save(); render(); toast('Premio canjeado: <b>' + p[0] + '</b>'); }
};

  $('#main').innerHTML = (VISTAS[S.vista] || VISTAS.panel)();
}
document.addEventListener('click', e => {
